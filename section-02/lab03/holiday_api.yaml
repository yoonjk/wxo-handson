openapi: 3.0.3

info:
  title: Nager.Date — Public Holiday API
  description: |
    전 세계 100개국 이상의 공휴일 정보를 제공하는 무료 공개 REST API입니다.
    인증이 필요 없으며 CORS를 지원합니다.

    **공식 사이트**: https://date.nager.at  
    **Swagger UI**: https://date.nager.at/swagger/index.html  
    **GitHub**: https://github.com/nager/Nager.Date

    ### 주요 특징
    - 인증(API Key 등) 불필요
    - 요청 횟수 제한 없음
    - 국가 코드: ISO 3166-1 alpha-2 (예: KR, US, JP, DE)
    - 날짜 형식: ISO 8601 (YYYY-MM-DD)
    - **WebApi V1·V2는 폐기됨. 반드시 V3만 사용할 것**

    ### 지원 공휴일 유형(types)
    | 값 | 설명 |
    |---|---|
    | `Public` | 법정 공휴일 |
    | `Bank` | 금융기관 휴무일 |
    | `School` | 학교 휴무일 |
    | `Authorities` | 관공서 휴무일 |
    | `Optional` | 선택적 휴일 |
    | `Observance` | 기념일(법정 휴일 아님) |

  version: "3.0"
  contact:
    name: Nager.Date Support
    url: https://date.nager.at
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://date.nager.at/api/v3
    description: 공식 프로덕션 서버 (무료, 인증 불필요)

tags:
  - name: PublicHolidays
    description: 공휴일 조회 (연도/국가별, 다음 공휴일, 오늘 공휴일 여부)
  - name: LongWeekend
    description: 연휴(징검다리 휴일 포함) 계산
  - name: Country
    description: 지원 국가 목록 및 국가 상세 정보
  - name: System
    description: API 버전 확인

paths:

  # ─────────────────────────────────────────────────────────────────────────
  # 1. 연도·국가별 공휴일 목록
  # ─────────────────────────────────────────────────────────────────────────
  /PublicHolidays/{year}/{countryCode}:
    get:
      operationId: get_public_holidays_by_year_and_country
      summary: 특정 연도와 국가의 공휴일 전체 목록을 조회합니다.
      description: |
        지정한 연도(4자리)와 국가 코드(ISO 3166-1 alpha-2)에 해당하는 모든 법정 공휴일을
        날짜 오름차순으로 반환합니다.

        - 과거·현재·미래 연도 모두 조회 가능합니다.
        - 지역별 공휴일이 있는 국가(예: 미국 주별, 독일 주별)는 `counties` 필드에 해당 지역 코드가 포함됩니다.
        - `global: true`인 항목은 해당 국가 전체에 적용되는 공휴일입니다.
        - 이 엔드포인트는 법정 공휴일 여부나 특정 업무일 계산에 사용하기 적합합니다.
        - 회사 창립일, 임시 공휴일 등 정부 공식 공휴일 외의 날짜는 포함되지 않습니다.
      tags:
        - PublicHolidays
      parameters:
        - name: year
          in: path
          required: true
          description: |
            조회할 연도 (4자리 정수).
            예: `2026`
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
            example: 2026
        - name: countryCode
          in: path
          required: true
          description: |
            ISO 3166-1 alpha-2 국가 코드 (대소문자 무관).
            예: `KR`(한국), `US`(미국), `JP`(일본), `DE`(독일), `GB`(영국)
            지원 국가 목록은 `/AvailableCountries` 엔드포인트에서 확인하세요.
          schema:
            type: string
            minLength: 2
            maxLength: 2
            pattern: "^[A-Za-z]{2}$"
            example: KR
      responses:
        "200":
          description: 공휴일 목록 반환 성공. 공휴일이 없는 경우 빈 배열 `[]`을 반환합니다.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicHoliday"
              example:
                - date: "2026-01-01"
                  localName: "새해"
                  name: "New Year's Day"
                  countryCode: "KR"
                  fixed: true
                  global: true
                  counties: null
                  launchYear: null
                  types:
                    - Public
                - date: "2026-03-01"
                  localName: "삼일절"
                  name: "Independence Movement Day"
                  countryCode: "KR"
                  fixed: true
                  global: true
                  counties: null
                  launchYear: null
                  types:
                    - Public
        "400":
          description: 잘못된 국가 코드 또는 연도 형식
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 지원하지 않는 국가 코드
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────────────────────────────────
  # 2. 다가오는 공휴일 (국가별, 향후 365일)
  # ─────────────────────────────────────────────────────────────────────────
  /NextPublicHolidays/{countryCode}:
    get:
      operationId: get_next_public_holidays_by_country
      summary: 특정 국가의 다가오는 공휴일 목록을 반환합니다 (향후 365일).
      description: |
        오늘 기준으로 향후 365일 이내에 있는 공휴일 목록을 날짜 오름차순으로 반환합니다.
        연도를 별도로 지정할 필요 없이 "곧 다가올 공휴일"을 빠르게 조회할 때 사용합니다.

        - 오늘 날짜는 서버 UTC 기준입니다.
        - 결과가 없으면 빈 배열을 반환합니다.
      tags:
        - PublicHolidays
      parameters:
        - name: countryCode
          in: path
          required: true
          description: "ISO 3166-1 alpha-2 국가 코드 (예: KR)"
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: KR
      responses:
        "200":
          description: 다가오는 공휴일 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicHoliday"
        "400":
          description: 잘못된 국가 코드
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 지원하지 않는 국가 코드
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────────────────────────────────
  # 3. 전 세계 다가오는 공휴일 (향후 7일)
  # ─────────────────────────────────────────────────────────────────────────
  /NextPublicHolidaysWorldwide:
    get:
      operationId: get_next_public_holidays_worldwide
      summary: 전 세계 모든 국가의 향후 7일 이내 공휴일 목록을 반환합니다.
      description: |
        오늘 기준 7일 이내에 공휴일이 있는 모든 국가의 공휴일을 반환합니다.
        글로벌 일정 대시보드나 "이번 주 어느 나라가 쉬는가" 조회에 적합합니다.
      tags:
        - PublicHolidays
      responses:
        "200":
          description: 전 세계 향후 7일 공휴일 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicHoliday"

  # ─────────────────────────────────────────────────────────────────────────
  # 4. 오늘 공휴일 여부 확인
  # ─────────────────────────────────────────────────────────────────────────
  /IsTodayPublicHoliday/{countryCode}:
    get:
      operationId: is_today_public_holiday
      summary: 오늘이 지정 국가의 공휴일인지 확인합니다.
      description: |
        서버의 현재 날짜(UTC 기준 + offset 보정)가 해당 국가의 공휴일이면
        HTTP 200을, 공휴일이 아니면 HTTP 204를 반환합니다.
        응답 바디가 아닌 **HTTP 상태 코드로 판별**합니다.

        - `countyCode`를 지정하면 해당 지역(예: 미국 특정 주)의 공휴일만 검사합니다.
        - `offset`은 클라이언트 타임존을 반영하기 위한 UTC 오프셋(분 단위)입니다.
          예: 한국(KST, UTC+9)의 경우 `offset=540`.
      tags:
        - PublicHolidays
      parameters:
        - name: countryCode
          in: path
          required: true
          description: "ISO 3166-1 alpha-2 국가 코드 (예: KR)"
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: KR
        - name: countyCode
          in: query
          required: false
          description: |
            지역(주/도) 코드. 지역별 공휴일을 구분하는 국가에서만 사용합니다.
            예: 미국 캘리포니아 → `US-CA`
          schema:
            type: string
            example: "US-CA"
        - name: offset
          in: query
          required: false
          description: |
            UTC 기준 타임존 오프셋 (분 단위).
            예: UTC+9(한국) → `540`, UTC-5(미 동부) → `-300`
          schema:
            type: integer
            minimum: -840
            maximum: 840
            example: 540
      responses:
        "200":
          description: 오늘은 공휴일입니다.
        "204":
          description: 오늘은 공휴일이 아닙니다.
        "400":
          description: 잘못된 국가 코드 또는 파라미터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 지원하지 않는 국가 코드
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────────────────────────────────
  # 5. 연휴(Long Weekend) 계산
  # ─────────────────────────────────────────────────────────────────────────
  /LongWeekend/{year}/{countryCode}:
    get:
      operationId: get_long_weekends_by_year_and_country
      summary: 특정 연도와 국가의 연휴(황금연휴) 목록을 계산해 반환합니다.
      description: |
        공휴일과 인접한 주말을 조합해 3일 이상 연속으로 쉴 수 있는 기간을 계산합니다.
        `needBridgeDay: true`인 경우, 하루를 연차로 사용하면 연휴가 이어지는 "징검다리 휴일" 상황입니다.

        여행 계획, 배송 가능 날짜 안내, 고객센터 휴무 안내 등에 활용할 수 있습니다.
      tags:
        - LongWeekend
      parameters:
        - name: year
          in: path
          required: true
          description: "조회할 연도 (4자리 정수, 예: 2026)"
          schema:
            type: integer
            minimum: 1900
            maximum: 2100
            example: 2026
        - name: countryCode
          in: path
          required: true
          description: "ISO 3166-1 alpha-2 국가 코드 (예: KR)"
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: KR
      responses:
        "200":
          description: 연휴 목록 반환 성공. 해당 연도에 연휴가 없으면 빈 배열을 반환합니다.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LongWeekend"
              example:
                - startDate: "2026-09-19"
                  endDate: "2026-09-23"
                  dayCount: 5
                  needBridgeDay: false
                - startDate: "2026-10-03"
                  endDate: "2026-10-04"
                  dayCount: 2
                  needBridgeDay: false
        "400":
          description: 잘못된 파라미터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 지원하지 않는 국가 코드
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────────────────────────────────
  # 6. 지원 국가 목록
  # ─────────────────────────────────────────────────────────────────────────
  /AvailableCountries:
    get:
      operationId: get_available_countries
      summary: API가 지원하는 모든 국가의 이름과 코드 목록을 반환합니다.
      description: |
        현재 이 API가 공휴일 데이터를 제공하는 국가의 전체 목록을 반환합니다.
        각 항목은 국가의 영문 표시명(`name`)과 ISO 3166-1 alpha-2 코드(`countryCode`)를 포함합니다.

        다른 엔드포인트에 `countryCode`를 입력하기 전에 이 목록에서 올바른 코드를 확인하세요.
        현재 100개국 이상이 지원됩니다.
      tags:
        - Country
      responses:
        "200":
          description: 지원 국가 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CountrySummary"
              example:
                - countryCode: "KR"
                  name: "South Korea"
                - countryCode: "US"
                  name: "United States"
                - countryCode: "JP"
                  name: "Japan"
                - countryCode: "DE"
                  name: "Germany"

  # ─────────────────────────────────────────────────────────────────────────
  # 7. 국가 상세 정보
  # ─────────────────────────────────────────────────────────────────────────
  /CountryInfo/{countryCode}:
    get:
      operationId: get_country_info
      summary: 특정 국가의 상세 정보(정식 명칭, 지역, 인접 국가)를 반환합니다.
      description: |
        국가 코드로 해당 국가의 공식 명칭, 일반 명칭, 소속 지역(continent),
        그리고 국경을 접하는 인접 국가 목록을 반환합니다.

        국가 선택 UI의 드롭다운 표시, 국가 코드 유효성 검증 등에 활용할 수 있습니다.
      tags:
        - Country
      parameters:
        - name: countryCode
          in: path
          required: true
          description: "ISO 3166-1 alpha-2 국가 코드 (예: KR)"
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: KR
      responses:
        "200":
          description: 국가 상세 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryInfo"
              example:
                commonName: "South Korea"
                officialName: "Republic of Korea"
                countryCode: "KR"
                region: "Asia"
                borders:
                  - commonName: "North Korea"
                    officialName: "Democratic People's Republic of Korea"
                    countryCode: "KP"
                    region: "Asia"
        "404":
          description: 지원하지 않는 국가 코드
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─────────────────────────────────────────────────────────────────────────
  # 8. API 버전 확인
  # ─────────────────────────────────────────────────────────────────────────
  /Version:
    get:
      operationId: get_api_version
      summary: 현재 사용 중인 Nager.Date 라이브러리 버전을 반환합니다.
      description: |
        서버에서 실행 중인 Nager.Date .NET 라이브러리의 버전 문자열을 반환합니다.
        API 통합 버전 호환성 확인이나 디버깅 목적으로 사용합니다.
      tags:
        - System
      responses:
        "200":
          description: 라이브러리 버전 문자열
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
              example:
                name: "Nager.Date"
                version: "3.8.0"

# ─────────────────────────────────────────────────────────────────────────────
# 공통 스키마 정의
# ─────────────────────────────────────────────────────────────────────────────
components:
  schemas:

    PublicHoliday:
      type: object
      description: 단일 공휴일 항목
      required:
        - date
        - localName
        - name
        - countryCode
        - fixed
        - global
        - types
      properties:
        date:
          type: string
          format: date
          description: 공휴일 날짜 (ISO 8601, YYYY-MM-DD)
          example: "2026-10-03"
        localName:
          type: string
          description: 해당 국가 언어로 된 공휴일 명칭
          example: "개천절"
        name:
          type: string
          description: 영문 공휴일 명칭
          example: "National Foundation Day"
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 국가 코드
          example: "KR"
        fixed:
          type: boolean
          description: |
            매년 같은 날짜에 고정된 공휴일이면 `true`.
            `false`이면 연도마다 날짜가 변동됩니다 (예: 부활절, 추석).
          example: true
        global:
          type: boolean
          description: |
            국가 전체에 적용되는 공휴일이면 `true`.
            `false`이면 일부 지역에만 적용되며 `counties` 필드에 대상 지역이 명시됩니다.
          example: true
        counties:
          type: array
          nullable: true
          description: |
            이 공휴일이 적용되는 지역(주/도) 코드 목록.
            `global: true`인 경우 `null`입니다.
            지역 코드 형식: `{countryCode}-{regionCode}` (예: `US-CA`)
          items:
            type: string
          example: null
        launchYear:
          type: integer
          nullable: true
          description: |
            이 공휴일이 처음 지정된 연도. 역사적 공휴일 필터링에 활용할 수 있습니다.
            알 수 없으면 `null`.
          example: null
        types:
          type: array
          description: |
            공휴일 유형 목록. 하나의 날짜가 여러 유형을 가질 수 있습니다.
            - `Public`: 법정 공휴일
            - `Bank`: 금융기관 휴무
            - `School`: 학교 휴무
            - `Authorities`: 관공서 휴무
            - `Optional`: 선택적 휴일
            - `Observance`: 기념일(법정 휴일 아님)
          items:
            type: string
            enum:
              - Public
              - Bank
              - School
              - Authorities
              - Optional
              - Observance
          example:
            - Public

    LongWeekend:
      type: object
      description: 연속 휴일(연휴) 기간 정보
      required:
        - startDate
        - endDate
        - dayCount
        - needBridgeDay
      properties:
        startDate:
          type: string
          format: date
          description: 연휴 시작 날짜 (YYYY-MM-DD)
          example: "2026-09-19"
        endDate:
          type: string
          format: date
          description: 연휴 종료 날짜 (YYYY-MM-DD)
          example: "2026-09-23"
        dayCount:
          type: integer
          description: 연휴 총 일수 (시작일~종료일 포함)
          example: 5
        needBridgeDay:
          type: boolean
          description: |
            `true`이면 징검다리 하루를 연차로 사용할 경우 연휴가 이어집니다.
            `false`이면 연차 없이 자동으로 연휴가 됩니다.
          example: false

    CountrySummary:
      type: object
      description: 지원 국가의 간략 정보
      required:
        - countryCode
        - name
      properties:
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 국가 코드
          example: "KR"
        name:
          type: string
          description: 국가 영문 표시명
          example: "South Korea"

    CountryInfo:
      type: object
      description: 국가 상세 정보
      required:
        - commonName
        - officialName
        - countryCode
        - region
      properties:
        commonName:
          type: string
          description: 국가 일반 영문 명칭
          example: "South Korea"
        officialName:
          type: string
          description: 국가 공식 영문 명칭
          example: "Republic of Korea"
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 국가 코드
          example: "KR"
        region:
          type: string
          description: 소속 대륙/지역명
          example: "Asia"
        borders:
          type: array
          nullable: true
          description: 국경을 공유하는 인접 국가 목록. 섬나라 등은 `null`이거나 빈 배열.
          items:
            $ref: "#/components/schemas/CountrySummaryWithRegion"

    CountrySummaryWithRegion:
      type: object
      description: 인접 국가 요약 정보
      properties:
        commonName:
          type: string
          description: 인접 국가 일반 영문 명칭
          example: "North Korea"
        officialName:
          type: string
          description: 인접 국가 공식 영문 명칭
          example: "Democratic People's Republic of Korea"
        countryCode:
          type: string
          description: 인접 국가 ISO 3166-1 alpha-2 코드
          example: "KP"
        region:
          type: string
          description: 인접 국가 소속 대륙/지역명
          example: "Asia"

    VersionInfo:
      type: object
      description: API 버전 정보
      properties:
        name:
          type: string
          description: 라이브러리 이름
          example: "Nager.Date"
        version:
          type: string
          description: 현재 버전 문자열 (Semantic Versioning)
          example: "3.8.0"

    ErrorResponse:
      type: object
      description: 오류 응답 본문
      properties:
        message:
          type: string
          description: 오류 설명 문자열
          example: "countryCode 'ZZ' is not supported"