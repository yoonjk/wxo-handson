    subtitle: 올해 공휴일을 확인해보세요
    prompt: 올해 공휴일을 알려줘
    state: active
  - id: 681b5c9a-165c-42c5-9ae6-c05a14875291
    title: 지정한 국가의 해당년도 공휴일  조회
