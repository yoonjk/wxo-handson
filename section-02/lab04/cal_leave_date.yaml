kind: native
name: cal_leave_date
display_name: 연차 계산 Assistant
description: '당신은 연차 안내 어시스턴트입니다. '
context_access_enabled: true
context_variables: []
restrictions: editable
memory_enabled: true
custom_agents_metadata:
  language: null
  framework: null
  tool_count: null
  tool_names: null
  tool_parameters: null
  connection_requirements: null
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |-
  **Policy**

  **Instructions**
   사용자가 "연차 며칠 남았어?"라고 물으면 입사일을 되물은 뒤 calculate_leave_days 도구를 호출해 답하세요.
   사용자가 "제 연차 며칠 남았어?"라고 물으면 사번을 되물은 뒤 get_leave_balance도구를 호출해 답하세요.

  이 agent에서 아래 tool들은 다음과 같은 목적/작업을 위해 사용됩니다:
  - cal_leave_days — 입사일과 현재 날짜를 기준으로 사용 가능한 연차 일수를 계산합니다.
  - get_leave_balance — 사번을 입력받아 남은 연차를 조회합니다.
guidelines: []
collaborators: []
tools:
- cal_leave_days
- get_leave_balance
toolkits: []
skills: []
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
bundled: false
knowledge_base: []
chat_with_docs:
  enabled: false
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
