    subtitle: 연차 몇일이야?
    prompt: '연차 몇일이야 '
    state: active
  - id: 89c22333-2d7b-4b63-84a0-05f4a2871db4
    title: 내 연차 계산
    subtitle: 내 연차 며칠 남았어?
    prompt: '내 연차 며칠 남았어 '
