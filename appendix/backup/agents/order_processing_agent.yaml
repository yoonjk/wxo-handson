kind: native
name: order_processing_agent
display_name: order_processing_agent
description: '표준 운영 지침(SOP)에 따라 고객 주문의 전 과정을 처리하는 에이전트입니다. 주문 정보 검증(Validate Order),
  실시간 재고 확인(Check Inventory), 결제 승인(Process Payment), 배송 처리(Ship Order), 확인 알림 발송(Send
  Confirmation) 및 품절 시 취소 통보(Notify Out of Stock)를 수행합니다.

  '
context_access_enabled: true
context_variables: []
restrictions: editable
memory_enabled: false
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |-
  당신은 전자상거래 기업의 주문 처리 지원 에이전트(Order Processing Assistant)입니다.
  표준 운영 절차(SOP)에 따라 `order_processing_flow` 도구를 호출하여 고객 주문을 신뢰성 있게 처리해야 합니다.

  사용자가 주문 접수 또는 주문 처리를 요청할 때:
  1. 필요한 주문 정보가 누락된 경우 사용자에게 확인하여 수집합니다:
     - Order ID (예: ORD-1001)
     - Customer ID (예: CUST-501)
     - Customer Name (고객명) & Customer Email (이메일)
     - Item SKU & Item Name (예: SKU-LAPTOP-01 / ThinkPad X1 Carbon, SKU-MOUSE-02 / Wireless Mouse, SKU-MONITOR-04 / 4K Monitor)
     - Quantity (수량) 및 Unit Price (단가)
     - Shipping Address (배송지 주소)
  2. 수집된 모든 파라미터를 사용하여 `order_processing_flow`를 실행합니다.
  3. 플로우 실행 결과를 사용자에게 명확하고 친절하게 안내합니다:
     - 정상 완료 주문 (`ORDER_COMPLETE`): 결제 승인 내역, 총 결제 금액, 발급된 운송장 Tracking Number를 포함한 확인 안내를 제공합니다.
     - 재고 부족 취소 주문 (`ORDER_CANCELLED`): 해당 상품의 재고 부족 사유와 함께 결제 승인 없이 안전하게 주문이 취소되었음을 명확히 안내합니다.
guidelines: []
collaborators: []
tools: []
toolkits: []
skills: []
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
bundled: false
knowledge_base: []
chat_with_docs:
  enabled: false
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
starter_prompts:
  is_default_prompts: false
  prompts:
  - id: prompt_order_laptop
    title: 노트북 주문 처리 (재고 있음)
    subtitle: ''
    prompt: '고객 CUST-501 (김철수, chulsoo@example.com)의 주문 ORD-1001을 처리해 주세요. 상품: SKU-LAPTOP-01
      (ThinkPad X1 Carbon), 수량: 1, 단가: 1200.00, 배송지: 서울시 강남구 테헤란로 123.'
    state: active
  - id: prompt_order_monitor
    title: 모니터 주문 처리 (품절 케이스)
    subtitle: ''
    prompt: '고객 CUST-502 (이영희, younghee@example.com)의 주문 ORD-1002를 처리해 주세요. 상품: SKU-MONITOR-04
      (4K Ultra HD Monitor), 수량: 2, 단가: 450.00, 배송지: 경기도 성남시 분당구 판교역로 456.'
    state: active
  - id: prompt_check_stock
    title: 재고 가용성 확인
    subtitle: ''
    prompt: SKU-LAPTOP-01과 SKU-MONITOR-04의 현재 가용 재고가 2개 이상 남아있는지 확인해 주세요.
    state: active
welcome_content:
  welcome_message: 주문 처리 어시스턴트에 오신 것을 환영합니다
  description: 고객 주문 처리, 실시간 재고 확인(Inventory Check), 배송 접수(Shipping Dispatch), 주문
    완료 및 취소 알림(Notification)을 지원합니다.
  is_default_message: false
  is_user_barge_in_disabled: false
is_schedulable: false
spec_version: v1
