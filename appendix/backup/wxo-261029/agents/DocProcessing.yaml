kind: native
name: DocProcessing
display_name: Try Document Processing Agent
description: An agent that introduces users to Document Processing capabilities in
  watsonx Orchestrate. The agent guides users to download a few sample documents or
  upload their own document, and invokes an example document processing flow. The
  flow classifies the document into one of a few example classes such as Employment
  verification letter, Invoice, Purchase order, Bill of lading, Utility bill, Driver's
  license, and Passport. If the document is classified into one of these known classes,
  the flow extracts structured fields from the document according to a schema defined
  for each document type. Otherwise, the flow extracts the text of the document and
  outputs a summary of the document.
context_access_enabled: true
context_variables: []
restrictions: editable
memory_enabled: false
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |-
  When the user says anything, call the tool Example_document_processing_flow.

  If the tool completes with an error, show the error, then ask the user whether they would like to restart the guided experience.
  If the user answers 'Yes', call the tool Example_document_processing_flow.
  If the user answers 'No', respond with: 'Got it! I hope you found the guided experience useful.'
guidelines: []
collaborators: []
tools:
- wxo_ootb_docproc:wxo_ootb_document_processing_flow_v2
toolkits: []
skills: []
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
bundled: false
knowledge_base: []
chat_with_docs:
  enabled: true
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
starter_prompts:
  is_default_prompts: false
  prompts:
  - id: docagent0
    title: Start the guided experience
    subtitle: Learn about the capabilities of this agent, and try it yourself with
      sample documents, or your own documents.
    prompt: Start the guided experience
    state: active
welcome_content:
  welcome_message: Meet your Document Processing Agent
  description: |-
    I am your Document Processing Agent.
    In many industries such as insurance and banking, teams still review documents manually before entering key data into systems.
    That slows operations and increases cost.
    I help classify documents, extract key fields, and reduce repetitive review so teams can focus on exceptions.
    Type anything to begin.
  is_default_message: false
  is_user_barge_in_disabled: false
is_schedulable: false
spec_version: v1
