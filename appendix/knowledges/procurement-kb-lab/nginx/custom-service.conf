# nginx reverse proxy for the custom search service.
# HTTP context: put this file where nginx.conf includes it INSIDE http { }
#   (Ubuntu: /etc/nginx/conf.d/ or /etc/nginx/sites-enabled/), NOT streams-enabled/.
# Check with:  grep -n include /etc/nginx/nginx.conf
# Apply with:  sudo nginx -t && sudo systemctl reload nginx

upstream custom_service_backend {
    server 127.0.0.1:8070;          # = CUSTOM_SERVICE_PORT in .env
}

server {
    listen 3464;                     # public port used in the Orchestrate Server URL
    # server_name your.host.name;

    # Keep headers with underscores (e.g. api_key). nginx drops them by default.
    underscores_in_headers on;

    location / {
        proxy_pass http://custom_service_backend;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
